# Dedicated WeTTY server only; never loads ~/.tmux.conf.
# tmux owns the terminal, while Herdr owns all user interaction.
set -g status off
set -g prefix None
set -g prefix2 None
unbind-key -a
unbind-key -a -T root
set -g mouse off
set -sg escape-time 0
# Herdr parses CSI-u even though its TMUX mode does not request extended keys.
# "on" would still downgrade Ctrl+Enter to CR; "always" preserves modifiers.
set -s extended-keys always
set -s extended-keys-format csi-u
set -g focus-events on
set -g default-terminal tmux-256color
set -as terminal-features ',xterm-256color:RGB'
set -g allow-passthrough on
set -g set-clipboard on
set -g window-size latest
set -g destroy-unattached off
set -s exit-unattached off
set -g remain-on-exit off
set -g history-limit 0
